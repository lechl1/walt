openapi: 3.0.3
info:
  title: walt
  version: 0.1.0
  description: >
    walt — the Ansible-Vault file-management daemon (waltd). Manages a vault
    tree at ${WALT_ROOT}/.vault/<project>/<env>/<file> (the same layout walt's
    CLI creates), encrypting/decrypting files with each environment's
    .vault-password. Runs as a root systemd service on :8470 and serves the
    SvelteKit GUI. It also embeds the SSH-key-management backend merged from the
    former `arthur` daemon — managed keypairs, host keys, and per-user
    authorized_keys, all on the local machine. Finally, the /api/eso/* routes
    host a vault environment as a remote secret store for the Kubernetes
    External Secrets Operator, over ESO's webhook-provider contract; they serve
    decrypted secrets and are disabled unless WALT_ESO_TOKEN is set. This spec
    is the contract shared by the `walt` CLI, the GUI, and the daemon. WS
    events: see asyncapi.yaml.
servers:
  - url: http://127.0.0.1:8470
    description: Local waltd
paths:
  /:
    get:
      summary: The embedded SvelteKit management GUI (SPA shell).
      operationId: index
      responses:
        '200':
          description: HTML page
          content:
            text/html:
              schema: { type: string }
  /healthz:
    get:
      summary: Liveness probe.
      operationId: healthz
      responses:
        '200':
          description: alive
          content:
            text/plain:
              schema: { type: string, example: ok }

  /api/projects:
    get:
      summary: List vault projects and their environments.
      operationId: listProjects
      responses:
        '200':
          description: projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }
    post:
      summary: Initialize a project (creates env dirs + .vault-password files).
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProject' }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { description: invalid project name }

  /api/projects/{project}/envs:
    parameters:
      - { name: project, in: path, required: true, schema: { type: string } }
    get:
      summary: List a project's environments.
      operationId: listEnvs
      responses:
        '200':
          description: environments
          content:
            application/json:
              schema:
                type: object
                properties:
                  environments:
                    type: array
                    items: { $ref: '#/components/schemas/EnvInfo' }
        '404': { description: unknown project }
    post:
      summary: Create an environment (with a .vault-password).
      operationId: createEnv
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEnv' }
      responses:
        '201': { description: created }
        '400': { description: invalid name }
        '404': { description: unknown project }

  /api/projects/{project}/envs/{env}/files:
    parameters:
      - { name: project, in: path, required: true, schema: { type: string } }
      - { name: env, in: path, required: true, schema: { type: string } }
    get:
      summary: List files in an environment (.vault-password excluded).
      operationId: listFiles
      responses:
        '200':
          description: files
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items: { $ref: '#/components/schemas/FileInfo' }
        '404': { description: unknown environment }
    post:
      summary: Add a new file, encrypting its content on write.
      operationId: addFile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddFile' }
      responses:
        '201':
          description: created (encrypted)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileInfo' }
        '400': { description: invalid file name }
        '404': { description: unknown environment }
        '409': { description: a file with that name already exists }
        '500': { description: env has no readable .vault-password }

  /api/projects/{project}/envs/{env}/files/{file}:
    parameters:
      - { name: project, in: path, required: true, schema: { type: string } }
      - { name: env, in: path, required: true, schema: { type: string } }
      - { name: file, in: path, required: true, schema: { type: string } }
    get:
      summary: Read a file's decrypted contents (for viewing/editing).
      operationId: getFile
      responses:
        '200':
          description: decrypted content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileContent' }
        '404': { description: no such file }
        '500': { description: decryption failed (bad/missing password) }
    put:
      summary: Replace a file's contents, re-encrypting on write.
      operationId: putFile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutFile' }
      responses:
        '204': { description: saved (encrypted) }
        '400': { description: invalid path }
        '404': { description: unknown environment }
    delete:
      summary: Delete a file.
      operationId: deleteFile
      responses:
        '204': { description: deleted (idempotent) }

  /api/projects/{project}/envs/{env}/encrypt:
    parameters:
      - { name: project, in: path, required: true, schema: { type: string } }
      - { name: env, in: path, required: true, schema: { type: string } }
    post:
      summary: Encrypt every plaintext file in the environment (or one).
      operationId: encryptEnv
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkReq' }
      responses:
        '204': { description: done }
        '404': { description: unknown environment }
        '500': { description: env has no readable .vault-password }

  /api/projects/{project}/envs/{env}/decrypt:
    parameters:
      - { name: project, in: path, required: true, schema: { type: string } }
      - { name: env, in: path, required: true, schema: { type: string } }
    post:
      summary: Decrypt every encrypted file in the environment (or one).
      operationId: decryptEnv
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkReq' }
      responses:
        '204': { description: done }
        '404': { description: unknown environment }
        '500': { description: decryption failed (bad/missing password) }

  # ---- ssh-key backend (merged from arthur) ----
  /api/keys:
    get:
      summary: List managed SSH keypairs.
      operationId: listKeys
      responses:
        '200':
          description: keypairs
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items: { $ref: '#/components/schemas/KeyInfo' }
    post:
      summary: Generate a new SSH keypair.
      operationId: generateKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateKeyRequest' }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyInfo' }
        '400': { description: invalid request }
        '409': { description: a key with that name already exists }
  /api/keys/{id}:
    delete:
      summary: Delete a keypair by id (its name).
      operationId: deleteKey
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: deleted (idempotent) }
  /api/host-keys:
    get:
      summary: List SSH keys already present on the host (not walt-managed).
      description: Scans every real login user's ~/.ssh/*.pub and /etc/ssh host keys.
      operationId: listHostKeys
      responses:
        '200':
          description: host keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items: { $ref: '#/components/schemas/HostKey' }
  /api/authorized:
    get:
      summary: List a user's authorized_keys.
      operationId: listAuthorized
      parameters:
        - { name: user, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: authorized keys
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizedResponse' }
        '404': { description: unknown user }
    post:
      summary: Add a public key to a user's authorized_keys.
      operationId: addAuthorized
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorizedMutation' }
      responses:
        '204': { description: added }
        '400': { description: not a valid public key }
        '404': { description: unknown user }
    delete:
      summary: Remove a public key from a user's authorized_keys.
      operationId: removeAuthorized
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorizedMutation' }
      responses:
        '204': { description: removed (idempotent) }
        '404': { description: unknown user }

  /api/eso/{project}/{env}:
    get:
      summary: >
        Every file in an environment, decrypted and merged into one flat map of
        Kubernetes Secret entries. For an ESO webhook SecretStore with
        `result.jsonPath: "$.data"`.
      operationId: esoGetEnv
      security: [{ esoBearer: [] }]
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
        - { name: env, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: secret entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EsoEnvSecrets' }
        '401': { description: invalid or missing bearer token }
        '404': { description: unknown environment }
        '503': { description: eso backend disabled (WALT_ESO_TOKEN unset) }
  /api/eso/{project}/{env}/{file}:
    get:
      summary: >
        One vault file, decrypted into Kubernetes Secret entries. A YAML mapping
        yields one entry per leaf (nested keys joined with '.'); anything else
        yields a single entry keyed by the file name.
      operationId: esoGetFile
      security: [{ esoBearer: [] }]
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
        - { name: env, in: path, required: true, schema: { type: string } }
        - { name: file, in: path, required: true, schema: { type: string } }
        - name: property
          in: query
          required: false
          description: >
            A single key within the file (ESO's remoteRef.property). Adds a
            top-level `value` for `result.jsonPath: "$.value"`.
          schema: { type: string }
      responses:
        '200':
          description: secret entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EsoFileSecrets' }
        '401': { description: invalid or missing bearer token }
        '404': { description: no such file or property }
        '422': { description: decrypted file is not UTF-8 }
        '503': { description: eso backend disabled (WALT_ESO_TOKEN unset) }
  /api/eso/manifest/{project}/{env}:
    get:
      summary: >
        Generate a ready-to-apply SecretStore + ExternalSecret pair wired to
        this daemon. Renders only — nothing is persisted.
      operationId: esoGetManifest
      security: [{ esoBearer: [] }]
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
        - { name: env, in: path, required: true, schema: { type: string } }
        - { name: namespace, in: query, schema: { type: string, default: default } }
        - { name: secret, in: query, description: 'Secret to materialize (default: <project>-<env>)', schema: { type: string } }
        - { name: url, in: query, description: 'waltd base URL as reachable from the cluster (default: $WALT_ESO_URL)', schema: { type: string } }
        - { name: file, in: query, description: vault file to pull; omit to merge the whole environment, schema: { type: string } }
        - { name: api_version, in: query, schema: { type: string, enum: [v1, v1beta1], default: v1 } }
        - { name: refresh_interval, in: query, schema: { type: string, default: 1h } }
      responses:
        '200':
          description: multi-document YAML manifest
          content:
            application/yaml:
              schema: { type: string }
        '400': { description: invalid file name or api_version }
        '401': { description: invalid or missing bearer token }
        '404': { description: unknown environment }
        '503': { description: eso backend disabled (WALT_ESO_TOKEN unset) }

components:
  securitySchemes:
    esoBearer:
      type: http
      scheme: bearer
      description: >
        Must equal the daemon's WALT_ESO_TOKEN. Applies to /api/eso/* only —
        every other route on this daemon is unauthenticated.
  schemas:
    EsoEnvSecrets:
      type: object
      properties:
        project: { type: string }
        env: { type: string }
        data:
          type: object
          additionalProperties: { type: string }
          description: plaintext Secret entries; ESO base64s them into the Secret
          example: { db_user: admin, db.host: pg.internal }
        sources:
          type: object
          additionalProperties: { type: string }
          description: which vault file each key came from (collisions are last-write-wins)
          example: { db_user: secrets.yml }
    EsoFileSecrets:
      type: object
      properties:
        project: { type: string }
        env: { type: string }
        file: { type: string }
        data:
          type: object
          additionalProperties: { type: string }
        value:
          type: string
          description: present only when ?property= was supplied
    Project:
      type: object
      properties:
        name: { type: string, example: creeper }
        environments:
          type: array
          items: { type: string }
          example: [dev, test, prod]
    CreateProject:
      type: object
      required: [name]
      properties:
        name: { type: string }
        environments:
          type: array
          items: { type: string }
          description: defaults to [dev, test, prod] when empty
        password:
          type: string
          description: password for the dev env (defaults to "dev"); other envs get a random one
    EnvInfo:
      type: object
      properties:
        name: { type: string, example: prod }
        file_count: { type: integer, example: 3 }
        has_password: { type: boolean }
    CreateEnv:
      type: object
      required: [name]
      properties:
        name: { type: string }
        password: { type: string, description: optional; dev defaults to "dev", else random }
    FileInfo:
      type: object
      properties:
        name: { type: string, example: secrets.env }
        encrypted: { type: boolean }
        size: { type: integer }
    FileContent:
      type: object
      properties:
        name: { type: string }
        content: { type: string, description: decrypted plaintext }
        encrypted: { type: boolean, description: whether the on-disk file was encrypted }
    AddFile:
      type: object
      required: [name]
      properties:
        name: { type: string }
        content: { type: string, default: '' }
    PutFile:
      type: object
      properties:
        content: { type: string, default: '' }
    BulkReq:
      type: object
      properties:
        file:
          type: string
          description: restrict to a single file; omit to act on every file in the env
    KeyInfo:
      type: object
      properties:
        id: { type: string, description: keypair name (file stem) }
        type: { type: string, enum: [ed25519, rsa, ecdsa] }
        fingerprint: { type: string, example: 'SHA256:abc…' }
        comment: { type: string }
        public_key: { type: string, description: full authorized_keys line }
    GenerateKeyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        type: { type: string, enum: [ed25519, rsa, ecdsa], default: ed25519 }
        comment: { type: string }
    HostKey:
      type: object
      properties:
        scope: { type: string, enum: [user, host], description: user ~/.ssh vs /etc/ssh host key }
        owner: { type: string, description: owning username, or "system" for host keys }
        path: { type: string }
        type: { type: string, example: ssh-ed25519 }
        fingerprint: { type: string, example: 'SHA256:abc…' }
        comment: { type: string }
        public_key: { type: string }
    AuthorizedResponse:
      type: object
      properties:
        user: { type: string }
        keys: { type: array, items: { type: string } }
    AuthorizedMutation:
      type: object
      required: [user, key]
      properties:
        user: { type: string }
        key: { type: string, description: full public-key line }
